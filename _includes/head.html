<!-- Generated from _data/tokens/*.yml at build time. -->
<link rel="stylesheet" href="{{ '/assets/css/tokens.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">

<!-- Applied before first paint so an explicit theme choice never flashes. -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem("ad-theme");
      if (stored === "dark" || stored === "light") {
        document.documentElement.setAttribute("data-theme", stored);
      }
    } catch (error) {
      /* Private windows and blocked storage are fine; the media query covers us. */
    }
  })();
</script>
