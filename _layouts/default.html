<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body>
  <a class="ad-doc-skip" href="#main">Skip to content</a>

  <header class="ad-doc-header">
    <div class="ad-doc-header__inner">
      {% include wordmark.html %}
      <div class="ad-doc-header__actions">
        {% include theme-toggle.html %}
        <a class="ad-btn ad-btn--secondary ad-btn--sm"
           href="https://github.com/{{ site.repository }}">Source</a>
      </div>
    </div>
  </header>

  <div class="ad-doc-layout">
    {% include sidebar.html %}
    <main class="ad-doc-main" id="main">
      {{ content }}
    </main>
  </div>

  <footer class="ad-doc-footer">
    <div class="ad-doc-footer__inner">
      <p>
        {{ site.title }} v{{ site.data.meta.version }} — built with Jekyll on Ruby
        {{ site.data.build.ruby }}.
      </p>
      <p><a href="https://github.com/{{ site.repository }}">View the source</a></p>
    </div>
  </footer>

  <script src="{{ '/assets/js/system.js' | relative_url }}" defer></script>
</body>
</html>
