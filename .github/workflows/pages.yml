name: Build and deploy to Pages

on:
  # Build every branch so a change is checked before it reaches the default
  # branch; the deploy job below is what is gated.
  push:
  pull_request:
  workflow_dispatch:

# The site is built here rather than by GitHub's hosted Jekyll because
# _plugins/ only runs in an unsafe build, and because that build would pin us
# to whatever Ruby GitHub Pages is using rather than Ruby 4.0.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby 4.0
        uses: ruby/setup-ruby@v1
        with:
          # Resolves to the latest 4.0.x the runner has, so a patch release
          # does not need a commit here.
          ruby-version: "4.0"
          bundler-cache: true

      - name: Report the toolchain
        run: |
          ruby -v
          bundle exec jekyll -v

      # The token tests are the deploy gate: they assert the contrast floors,
      # that every ramp darkens monotonically, and that no unresolved token
      # reference reaches the stylesheet.
      - name: Test the token compiler
        run: bundle exec rake test

      # The baseurl comes from _config.yml rather than actions/configure-pages,
      # so the build does not depend on the Pages API being reachable and stays
      # green on branches and forks. Change it there if the site ever moves off
      # a project page.
      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Check the build output
        run: |
          test -s _site/index.html
          test -s _site/assets/css/tokens.css
          grep -q -- '--ad-color-accent:' _site/assets/css/tokens.css
          # A reference that failed to resolve would appear verbatim in the CSS.
          ! grep -Eq ':[[:space:]]*[a-z]+\.[a-z0-9]+;' _site/assets/css/tokens.css
          # Every page in the nav should have been rendered.
          for page in rationale install foundations/color foundations/typography \
                      foundations/space foundations/elevation foundations/motion \
                      components/button components/icon-button components/badge \
                      components/tag components/card components/card-row \
                      components/field components/input components/select \
                      components/checkbox components/radio components/switch \
                      components/tooltip components/toast components/dialog \
                      components/tabs \
                      patterns/loop patterns/archive; do
            test -s "_site/$page/index.html" || { echo "missing $page"; exit 1; }
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Requires Pages to be set to "GitHub Actions" once, under
  # Settings -> Pages -> Build and deployment. The workflow token is not
  # permitted to turn that on for you.
  deploy:
    needs: build
    # Deploy from whichever branch the repository calls default, rather than a
    # hard-coded name.
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
