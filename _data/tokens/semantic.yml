# Semantic colour aliases. Every component reads from this file and never
# from a raw ramp. Values are either a `ramp.step` reference or a literal CSS
# colour; `_plugins/token_generator.rb` resolves references at build time.
#
# `light` and `dark` are emitted as `:root` and `[data-theme="dark"]` blocks.
# Two groups below — Accent's `-ink`/`-soft` pair and Status's `-bg` pair —
# are literal `color-mix()` expressions rather than ramp references, exactly
# mirroring the source's own `tokens/colors.css`. A `color-mix()` string is
# not a flat hex, so `lib/arbitrary_definitions/color_math.rb` declines to
# measure it (by design — see `HEX_PATTERN` / `UNMEASURABLE`); none of those
# four tokens appears in `contrast.yml` for that reason.
groups:
  - name: Surfaces
    id: surface
    description: Backgrounds, from the page itself up to a card sitting on it.
    tokens:
      - token: color-surface-page
        light: neutral.0
        dark: neutral_dark.0
        usage: The page itself. Nothing sits behind it.
      - token: color-surface-card
        light: neutral.50
        dark: neutral_dark.50
        usage: Cards, dialogs, toasts — anything that reads as a sheet on the page.
      - token: color-surface-fill
        light: neutral.100
        dark: neutral_dark.100
        usage: Recessed fill — a hovered row, a segmented-tab track, a photo placeholder.
      - token: color-surface-fill-2
        light: neutral.150
        dark: neutral_dark.150
        usage: A second, deeper fill step — the diagonal-grain stripe inside an empty photo slot.

  - name: Borders
    id: border
    description: Two weights. Hairlines do most of the elevation work in this system, so there was never a reason for a third.
    tokens:
      - token: color-border-hairline
        light: neutral.200
        dark: neutral_dark.200
        usage: Card edges, row dividers, dialog dividers. The default edge everywhere.
      - token: color-border-default
        light: neutral.300
        dark: neutral_dark.300
        usage: Input and button borders — anything a reader has to recognise as a control.

  - name: Text
    id: text
    description: Three levels of emphasis, deliberately not four. Past three, a reader stops perceiving a hierarchy and starts perceiving noise.
    tokens:
      - token: color-text-primary
        light: neutral.900
        dark: neutral_dark.900
        usage: Body copy, headings, and every control label.
      - token: color-text-secondary
        light: neutral.600
        dark: neutral_dark.600
        usage: Supporting copy, hints, mono meta values, type-label's colour.
      - token: color-text-tertiary
        light: neutral.500
        dark: neutral_dark.500
        usage: >-
          Placeholders and de-emphasised metadata only — never body text. This
          step is intentionally sub-AA against the page; see the caveat on the
          Colour page.

  - name: Accent
    id: accent
    description: >-
      One swappable accent per project, held constant across a whole view.
      `-ink` and `-soft` re-derive from `--ad-color-accent` via `color-mix()`
      exactly as the source computes them, so retheming the accent retones
      both automatically.
    tokens:
      - token: color-accent
        light: accent.teal
        dark: accent.teal
        usage: Primary buttons, links, focus affordance, the active tab underline. Never two accents in one view.
      - token: color-accent-fg
        light: "#ffffff"
        dark: "#ffffff"
        usage: Label and icon colour on a filled accent surface. Fixed white, not a ramp reference.
      - token: color-accent-ink
        light: "color-mix(in oklch, var(--ad-color-accent) 78%, black)"
        dark: "color-mix(in oklch, var(--ad-color-accent) 78%, black)"
        usage: Text sitting on an `-soft` accent tint — an IconButton's active state, an accent avatar's initials.
      - token: color-accent-soft
        light: "color-mix(in oklch, var(--ad-color-accent) 12%, white)"
        dark: "color-mix(in oklch, var(--ad-color-accent) 12%, white)"
        usage: The tint behind an accent Badge, a toggled IconButton, an accent avatar chip.

  - name: Status
    id: status
    description: >-
      Exactly two states, both fixed — they read the same in every project and
      are never swapped the way the accent is.
    tokens:
      - token: color-success
        light: "#3f7a4a"
        dark: "#3f7a4a"
        usage: Success text and icons — a completed task's check, a saved-state badge.
      - token: color-success-bg
        light: "color-mix(in oklch, var(--ad-color-success) 12%, white)"
        dark: "color-mix(in oklch, var(--ad-color-success) 12%, white)"
        usage: Tint behind a success Badge. Mixed against literal white, so it stays constant across themes.
      - token: color-danger
        light: "#ad3a2c"
        dark: "#ad3a2c"
        usage: Overdue/destructive text, the Toast undo action, a danger Button's fill.
      - token: color-danger-bg
        light: "color-mix(in oklch, var(--ad-color-danger) 10%, white)"
        dark: "color-mix(in oklch, var(--ad-color-danger) 10%, white)"
        usage: Tint behind a danger Badge. Mixed against literal white, so it stays constant across themes.
