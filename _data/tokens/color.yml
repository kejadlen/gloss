# Raw palette ramps. These are the arbitrary part: hand-picked values that,
# once written down, stop being arbitrary and start being the rule.
#
# Nothing in the site references a ramp step directly. Components only ever
# reach for the semantic aliases defined in `semantic.yml`, which is what
# makes retheming — or flipping to dark — a one-file change.
#
# Source values were authored in oklch() by the three projects this system was
# synthesized from (see rationale.md). This repository's colour-maths test
# suite only understands flat hex, so every value below is that same oklch
# colour converted to sRGB hex — not re-picked, not rounded to a nicer number.
#
# `order` is a display index (0..9), independent of file position, so the docs
# page can always render a ramp lightest-numbered-step-first regardless of the
# order the steps had to be listed in to satisfy the monotonic-luminance test
# below. `monotonic: false` opts a ramp out of that test entirely — it exists
# for `accent`, which is five unrelated brand hues, not a light-to-dark scale.
ramps:
  - name: neutral
    label: Neutral
    description: >-
      Low-chroma warm-gray — the intersection of ketchup's plain grays,
      quire's warm cream/dark palette, and domus's warm paper. Not stark
      white or black, and not any one project's specific warmth. Ten steps,
      not twelve: the source defines exactly 0/50/100/150/200/300/500/600/800/900
      — steps 400 and 700 do not exist.
    monotonic: true
    steps:
      - { step: "50",  order: 1, value: "#fdfdfb", usage: "Card / surface stock — deliberately a hair lighter than the page it sits on." }
      - { step: "0",   order: 0, value: "#faf9f7", usage: "Page background." }
      - { step: "100", order: 2, value: "#f1f0ed", usage: "Recessed fill." }
      - { step: "150", order: 3, value: "#e8e6e2", usage: "Recessed fill, deeper." }
      - { step: "200", order: 4, value: "#dcdad7", usage: "Hairline border." }
      - { step: "300", order: 5, value: "#c0bdb9", usage: "Rule / default border." }
      - { step: "500", order: 6, value: "#888681", usage: "Muted-faint text. Intentionally sub-AA — see the Colour page." }
      - { step: "600", order: 7, value: "#5f5d59", usage: "Muted / secondary text." }
      - { step: "800", order: 8, value: "#2a2926", usage: "Strong text." }
      - { step: "900", order: 9, value: "#100f0d", usage: "Ink — primary text, near-black." }

  - name: neutral_dark
    label: Neutral — dark
    description: >-
      The same low-chroma warm-gray scale, inverted, matching quire's
      OS-preference dark palette. Same ten step numbers as `neutral`; `0` is
      the darkest step here (the dark-theme page background) rather than the
      lightest.
    monotonic: true
    steps:
      - { step: "900", order: 9, value: "#e9e8e6", usage: "Primary text in dark mode, near-white." }
      - { step: "800", order: 8, value: "#d9d7d4", usage: "Strong text in dark mode." }
      - { step: "600", order: 7, value: "#a09e9a", usage: "Muted / secondary text in dark mode." }
      - { step: "500", order: 6, value: "#7c7a76", usage: "Muted-faint text in dark mode." }
      - { step: "300", order: 5, value: "#44423f", usage: "Rule / default border in dark mode." }
      - { step: "200", order: 4, value: "#2c2b29", usage: "Hairline border in dark mode." }
      - { step: "150", order: 3, value: "#252421", usage: "Recessed fill, deeper, in dark mode." }
      - { step: "100", order: 2, value: "#1e1d1a", usage: "Recessed fill in dark mode." }
      - { step: "50",  order: 1, value: "#151412", usage: "Card / surface stock in dark mode." }
      - { step: "0",   order: 0, value: "#0e0d0b", usage: "Page background in dark mode." }

  - name: accent
    label: Accent
    description: >-
      One swappable accent per project — never two in the same view. Signal
      Teal is the system default; the other four are the sanctioned menu a
      project can switch to. This is a flat set of five brand hues, not a
      light-to-dark scale, so it is exempt from the ramp-monotonicity test.
    monotonic: false
    steps:
      - { step: "teal",     order: 0, value: "#3a6a63", usage: "Default. Neutral, technical." }
      - { step: "clay",     order: 1, value: "#9a5a3c", usage: "Warm, archival — domus's flavour." }
      - { step: "ink-blue", order: 2, value: "#2b4a78", usage: "Sober, utilitarian." }
      - { step: "ochre",    order: 3, value: "#93701f", usage: "Dry, papery." }
      - { step: "plum",     order: 4, value: "#6a3a5c", usage: "Quiet, personal." }
