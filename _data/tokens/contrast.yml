# The contrast contract.
#
# Colour is the one part of a design system that is not arbitrary: a ratio is
# a fact about two colours and a pair of eyes. So these pairings are asserted
# by test/test_token_set.rb in both themes, and the same list renders the
# contract table on the Colour page. Adding a pair here adds it to the deploy
# gate.
#
# Two things this system deliberately does NOT assert, both explained on the
# Colour page rather than forced to pass:
#   - `color-text-tertiary` (neutral.500) is 3.46:1 on the page in light mode —
#     under the 4.5:1 floor. The source documents that step as "muted-faint
#     text", reserved for placeholders and metadata, never body copy. That is
#     a real, intentional property of the source palette, not a bug to fix by
#     darkening the step.
#   - Border contrast. `color-border-hairline` / `color-border-default` sit
#     well under the 3:1 WCAG 1.4.11 asks of a meaningful boundary — the
#     source's own words are "hairline (1px) borders and dividers do most of
#     the elevation work", i.e. borders are deliberately decorative here. The
#     source never claims a 3:1 bar for them, so this contract does not
#     invent one.
#
# `color-accent-ink`, `color-accent-soft`, `color-success-bg`, and
# `color-danger-bg` are `color-mix()` expressions, not flat hex, so
# `lib/arbitrary_definitions/color_math.rb` cannot measure them — none of the
# four appears on either side of a pair below.
text:
  label: Text
  minimum: 4.5
  standard: WCAG 2.1 SC 1.4.3 (normal-size text)
  pairs:
    - { foreground: color-text-primary, background: color-surface-page, note: Body copy, headings, and control labels on the page. }
    - { foreground: color-text-secondary, background: color-surface-page, note: Supporting copy, hints, and mono meta values. }
    - { foreground: color-accent-fg, background: color-accent, note: The label on a primary or dark-variant Button. }
    - { foreground: color-success, background: color-accent-fg, note: Success text on a light backdrop — proxied by color-accent-fg, the system's only literal-white token, since color-success-bg is an unmeasurable color-mix() tint. }
    - { foreground: color-danger, background: color-accent-fg, note: Overdue/destructive text on a light backdrop, proxied the same way as success above. }
