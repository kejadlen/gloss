# Non-colour tokens. `_plugins/token_generator.rb` turns most groups below
# into a block of CSS custom properties under `:root`; `typography.styles` is
# the one exception — those eight are compound rules (family + size + weight +
# line-height + tracking in one declaration, exactly as the source ships
# them), so they are written directly into `_sass/base/_typography.scss`
# rather than compiled from here. This file is still their source of record:
# the typography foundation page renders its specimen table from `styles`.
typography:
  label: Typography
  description: >-
    Three families and eight fluid Utopia steps (320→1240px viewport, 18→20px
    body). Only one webfont is loaded — IBM Plex Mono; sans is a web-safe
    system stack and serif is an opt-in reading variant, not loaded by default.
  webfont_import: "@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');"
  families:
    - token: font-sans
      value: '-apple-system, "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif'
      usage: Interface text — every component, every screen. Web-safe; nothing is loaded for it.
    - token: font-mono
      value: '"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace'
      usage: Every label, meta value, technical/catalog value, and code sample. The system's one loaded webfont.
    - token: font-serif
      value: 'Georgia, "Times New Roman", "Iowan Old Style", serif'
      usage: Opt-in reading variant for a project that wants an editorial, archival feel (domus-style). Not loaded by default; web-safe only.
  steps:
    - { token: step--2, value: "clamp(0.7813rem, 0.7736rem + 0.0341vw, 0.8rem)",        px: "12.5 → 12.8", usage: "type-label — eyebrows, catalog labels, meta." }
    - { token: step--1, value: "clamp(0.9375rem, 0.9119rem + 0.1136vw, 1rem)",          px: "15 → 16",     usage: "type-body-sm and type-mono — secondary copy, technical values." }
    - { token: step-0,  value: "clamp(1.125rem, 1.0739rem + 0.2273vw, 1.25rem)",        px: "18 → 20",     usage: "type-body — the base size, and the body element's own size." }
    - { token: step-1,  value: "clamp(1.35rem, 1.2631rem + 0.3864vw, 1.5625rem)",       px: "22 → 25",     usage: "type-h3 — card and subsection headings." }
    - { token: step-2,  value: "clamp(1.62rem, 1.4837rem + 0.6057vw, 1.9531rem)",       px: "26 → 31",     usage: "type-h2 — section headings." }
    - { token: step-3,  value: "clamp(1.944rem, 1.7405rem + 0.9044vw, 2.4414rem)",      px: "31 → 39",     usage: "type-h1 — screen titles." }
    - { token: step-4,  value: "clamp(2.3328rem, 2.0387rem + 1.3072vw, 3.0518rem)",     px: "37 → 49",     usage: "type-display — one hero title per screen, at most." }
    - { token: step-5,  value: "clamp(2.7994rem, 2.384rem + 1.8461vw, 3.8147rem)",      px: "45 → 61",     usage: "Reserved headroom. No compound style claims it yet." }
  styles:
    - { class: type-display, family: font-sans, weight: 600, size: step-4,  line_height: "1.08", tracking: "-0.015em", transform: none,    usage: "Page-level hero title, once per screen." }
    - { class: type-h1,      family: font-sans, weight: 600, size: step-3,  line_height: "1.12", tracking: "-0.012em", transform: none,    usage: "Screen title." }
    - { class: type-h2,      family: font-sans, weight: 600, size: step-2,  line_height: "1.16", tracking: "-0.01em",  transform: none,    usage: "Section heading." }
    - { class: type-h3,      family: font-sans, weight: 600, size: step-1,  line_height: "1.25", tracking: "normal",   transform: none,    usage: "Card / subsection heading." }
    - { class: type-body,    family: font-sans, weight: 400, size: step-0,  line_height: "1.55", tracking: "normal",   transform: none,    usage: "Body copy." }
    - { class: type-body-sm, family: font-sans, weight: 400, size: step--1, line_height: "1.5",  tracking: "normal",   transform: none,    usage: "Secondary copy, hints." }
    - { class: type-label,   family: font-mono, weight: 500, size: step--2, line_height: "1",    tracking: "0.08em",   transform: uppercase, usage: "Eyebrows, catalog labels, meta — SAVED, RECOMMENDED, OVERDUE." }
    - { class: type-mono,    family: font-mono, weight: 400, size: step--1, line_height: "1.5",  tracking: "normal",   transform: none,    usage: "Technical values, IDs, dates, code." }

space:
  label: Space
  description: >-
    Nine fluid Utopia steps (320→1240px viewport), the same shared config as
    type. 3xs through 3xl — no numbered scale, because there is no fixed base
    unit here to count multiples of.
  scale:
    - { token: space-3xs, value: "clamp(0.3125rem, 0.3125rem + 0vw, 0.3125rem)",       px: "5",       usage: "The tightest gap — an icon to its label inside a small control." }
    - { token: space-2xs, value: "clamp(0.5625rem, 0.5369rem + 0.1136vw, 0.625rem)",   px: "9 → 10",  usage: "Field-internal gaps, badge and tag padding." }
    - { token: space-xs,  value: "clamp(0.875rem, 0.8494rem + 0.1136vw, 0.9375rem)",   px: "14 → 15", usage: "Control padding-inline, row-internal gaps, CardRow padding." }
    - { token: space-s,   value: "clamp(1.125rem, 1.0739rem + 0.2273vw, 1.25rem)",     px: "18 → 20", usage: "Field-to-field spacing, Dialog title/footer padding." }
    - { token: space-m,   value: "clamp(1.6875rem, 1.6108rem + 0.3409vw, 1.875rem)",   px: "27 → 30", usage: "Card body padding, Dialog body padding — the system's default inset." }
    - { token: space-l,   value: "clamp(2.25rem, 2.1477rem + 0.4545vw, 2.5rem)",       px: "36 → 40", usage: "Page gutters, section-to-section gaps." }
    - { token: space-xl,  value: "clamp(3.375rem, 3.2216rem + 0.6818vw, 3.75rem)",     px: "54 → 60", usage: "Major section spacing — the gap above a dashboard's task list." }
    - { token: space-2xl, value: "clamp(4.5rem, 4.2955rem + 0.9091vw, 5rem)",          px: "72 → 80", usage: "Page-level rhythm." }
    - { token: space-3xl, value: "clamp(6.75rem, 6.4432rem + 1.3636vw, 7.5rem)",       px: "108 → 120", usage: "Hero and empty-state breathing room." }

radius:
  label: Radius
  description: >-
    Small and quiet: a 4/6/10px scale, kept modest so it reads as a neutral
    default rather than any one source project's specific softness. Nothing
    pill-shaped except true pills.
  scale:
    - { token: radius-sm,   value: "4px",   usage: "Buttons, inputs, badges, tags." }
    - { token: radius-md,   value: "6px",   usage: "IconButton, the segmented-tabs track, avatar chips." }
    - { token: radius-lg,   value: "10px",  usage: "Cards, dialogs, toasts, photo slots — the system's \"surface\" radius." }
    - { token: radius-full, value: "999px", usage: "True pills only — Badge, Tag, Switch, round avatars." }
    - { token: border-w,    value: "1px",   usage: "The one hairline weight in the system." }

elevation:
  label: Elevation
  description: >-
    Two levels only, as every source project uses: flat — no shadow, a
    hairline border does the work, and the default everywhere — and one
    `shadow-float` for the single most-elevated element in a view: a Dialog,
    a Toast, a floating menu.
  scale:
    - token: shadow-sm
      value: "0 1px 2px rgba(20, 18, 14, 0.05)"
      usage: Barely-there separation — a Switch thumb, a focused Input.
    - token: shadow-float
      value: "0 2px 6px rgba(20, 18, 14, 0.06), 0 10px 24px -12px rgba(20, 18, 14, 0.18)"
      usage: The one floating layer in a view. Apply it to at most one element on screen at a time.

motion:
  label: Motion
  description: >-
    Two durations and one easing curve — this is an interface, not a title
    sequence. Short ease transitions on hover/focus only; no bounce, no
    spring, no page-transition choreography.
  durations:
    - { token: dur-fast, value: "0.12s", usage: "Hover and focus colour/border transitions — the default." }
    - { token: dur-base, value: "0.16s", usage: "Switch track and thumb — the one moving part in the system." }
  easings:
    - { token: ease, value: "cubic-bezier(0.2, 0, 0, 1)", usage: "The only easing curve in the system. Fast out, settles gently, applied to every transition." }
